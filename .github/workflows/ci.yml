name: Validação
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aoponto
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: aoponto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aoponto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aoponto:ci_only@localhost:5432/aoponto
      TEST_DATABASE_URL: postgresql://aoponto:ci_only@localhost:5432/aoponto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - name: Validar backup e restauração em banco isolado
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U aoponto -d aoponto -Fc -f /tmp/aoponto.dump
          docker exec ${{ job.services.postgres.id }} createdb -U aoponto aoponto_restore
          docker exec ${{ job.services.postgres.id }} pg_restore -U aoponto -d aoponto_restore --no-owner /tmp/aoponto.dump
          docker exec ${{ job.services.postgres.id }} psql -U aoponto -d aoponto_restore -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM cuts; SELECT count(*) FROM schema_migrations;"
      - name: Construir imagem de implantação
        run: docker build -t ao-ponto:ci .
      - name: Verificar aplicação empacotada
        run: |
          docker run -d --name ao-ponto-ci --network host -e DATABASE_URL="$DATABASE_URL" ao-ponto:ci
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:3001/api/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3001/api/cuts
          curl --fail http://127.0.0.1:3001/ | grep 'root'
      - name: Logs da aplicação
        if: failure()
        run: docker logs ao-ponto-ci || true
