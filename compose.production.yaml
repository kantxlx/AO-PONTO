services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: aoponto
      POSTGRES_DB: aoponto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoponto"]
      interval: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aoponto:${POSTGRES_PASSWORD}@db:5432/aoponto
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      CATALOG_SOURCE: postgres
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
volumes:
  production_data:
